name: inspect-api
on:
  push:
    paths: ['inspect/classes.txt']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.2.0 }
      - run: ./scripts/resolve-versions.sh
      - name: Prepare mapped jar
        run: |
          mkdir -p src/main/java/x && echo 'package x; public class A{}' > src/main/java/x/A.java
          echo '{"schemaVersion":1,"id":"raftsurvival","version":"1","environment":"*"}' > src/main/resources/fabric.mod.json
          gradle build -x test --stacktrace 2>&1 | tail -30
      - name: javap
        run: |
          JARS=$(find ~/.gradle/caches/fabric-loom -name '*.jar' -path '*minecraft*' ! -name '*sources*' | head -20); echo "$JARS"
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged*.jar' ! -name '*sources*' | head -1); echo USING $J
          while read c; do [ -z "$c" ] && continue; echo "=== $c"; javap -p -cp "$J" "$c" 2>&1; done < inspect/classes.txt
